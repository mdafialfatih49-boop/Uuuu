name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q supernetherite-mod.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build
        working-directory: supernetherite
      - uses: actions/upload-artifact@v4
        with:
          name: supernetherite-jar
          path: supernetherite/build/libs/supernetherite-*[0-9].jar
